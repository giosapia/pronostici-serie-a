name: Quote operatori
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "quote = scarica le quote (5 richieste); discover = esplora il servizio"
        default: quote
permissions:
  contents: write
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica le quote
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          MODE: ${{ github.event.inputs.mode || 'quote' }}
        run: node scripts/quote.mjs
      - name: Salva i file nel repository
        run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento quote"
            git push
          fi
